<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .map-quartier-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-gradient-primary);
      padding: 40px 60px;
      box-sizing: border-box;
      page-break-inside: avoid;
      page-break-after: always;
      break-inside: avoid;
      break-after: page;
      position: relative;
    }

    .map-quartier-page::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      z-index: 1;
    }

    .address-header {
      width: 100%;
      max-width: 900px;
      margin-bottom: 2rem;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .address-title {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin: 0 0 1rem 0;
    }

    .map-container {
      width: 100%;
      max-width: 900px;
      height: 50vh;
      margin-bottom: 2.5rem;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--color-border);
      position: relative;
      z-index: 2;
    }

    .map-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .description-container {
      width: 100%;
      max-width: 900px;
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      padding: 2rem 2.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--color-border);
      position: relative;
      z-index: 2;
    }

    .description-container h3.quartier-title {
      font-size: var(--font-size-xl);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: 1rem;
      text-align: left;
      letter-spacing: -0.01em;
    }

    .description-container p {
      font-size: var(--font-size-lg);
      color: var(--color-text-secondary);
      line-height: 1.8;
      text-align: justify;
      margin: 0;
    }
    
    .address-header {
      width: 100%;
      max-width: 900px;
      margin-bottom: 1.5rem;
      text-align: left;
      position: relative;
      z-index: 2;
    }

    @media print {
      .map-quartier-page {
        page-break-inside: avoid !important;
        page-break-after: always !important;
        break-inside: avoid !important;
        break-after: page !important;
        min-height: 100vh !important;
      }
    }
  </style>
</head>
<body>
  <div class="map-quartier-page">
    {{#if adresse}}
    <div class="address-header">
      <h2 class="address-title">{{adresse}}</h2>
    </div>
    {{/if}}
    {{#if lat}}{{#if lng}}
    <div class="map-container">
      <img src="https://maps.googleapis.com/maps/api/staticmap?center={{lat}},{{lng}}&zoom=16&size=900x600&maptype=roadmap&key=AIzaSyDrxyRde3ZTmrpmid5De5Wo33YjAx2MvT0&markers=color:red%7Csize:large%7C{{lat}},{{lng}}" alt="Carte du bien" />
    </div>
    {{/if}}{{/if}}
    {{#if description_quartier}}
    <div class="description-container">
      <h3 class="quartier-title">Quartier</h3>
      <p>{{description_quartier}}</p>
    </div>
    {{/if}}
  </div>
</body>
</html>
