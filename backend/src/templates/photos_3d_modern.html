<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
    }
    .photos-3d-page {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.2rem;
      page-break-after: always;
      background: #fff;
    }
    .photos-3d-title {
      font-size: 1.7rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #e2e8f0;
      flex-shrink: 0;
      text-align: center;
    }
    .photos-3d-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      min-height: 0;
    }
    .photo-3d-item {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 16px;
      background: #f8fafc;
    }
    .photo-3d-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 16px;
    }
    @media print {
      .photos-3d-page {
        height: 100vh;
        min-height: 100vh;
        page-break-after: always;
      }
      .photo-3d-item {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="photos-3d-page">
    <div class="photos-3d-title">Vues 3D du projet</div>
    <div class="photos-3d-list">
      {{#each images}}
        <div class="photo-3d-item">
          <img src="{{url}}" alt="Vue 3D">
        </div>
      {{/each}}
    </div>
  </div>
</body>
</html>
