<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .photos-before-section {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      box-sizing: border-box;
      page-break-after: always;
      overflow: hidden;
      padding-bottom: 1.5rem;
    }
    .photos-before-section .section-title {
      font-size: 1.7rem;
      font-weight: 700;
      color: #1a202c;
      margin: 1.2rem 0 0.7rem 2.2rem;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid #e2e8f0;
      z-index: 2;
      position: relative;
      flex-shrink: 0;
    }
    .photos-before-grid {
      display: grid;
      grid-template-columns: repeat({{cols}}, {{photoWidthVw}}vw);
      grid-auto-rows: {{photoHeightVh}}vh;
      gap: {{gapVh}}vh {{gapVw}}vw;
      width: 100%;
      padding: 1.2rem 24px 1.5rem 24px;
      box-sizing: border-box;
      background: #fff;
      flex: 1;
      overflow: hidden;
      justify-content: center;
      align-content: start;
    }
    .photo-before-item {
      width: {{photoWidthVw}}vw;
      height: {{photoHeightVh}}vh;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      overflow: hidden;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-before-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 14px;
    }
    @media print {
      .photos-before-section {
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        max-height: 100vh;
        padding: 0;
        margin: 0;
        page-break-after: always;
      }
      .photos-before-grid {
        padding: 1.2rem 24px 1.2rem 24px;
      }
      .photo-before-item {
        box-shadow: none;
        border: 1px solid #e2e8f0;
      }
    }
  </style>
</head>
<body>
  <div class="photos-before-section">
    <div class="section-title">Photos avant travaux</div>
    <div class="photos-before-grid">
      {{#each images}}
        <div class="photo-before-item">
          <img src="{{url}}" alt="Photo avant travaux">
        </div>
      {{/each}}
    </div>
  </div>
</body>
</html>
