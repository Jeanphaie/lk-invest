<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .photos-section {
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    .section-title {
      font-size: 1.7rem;
      font-weight: 700;
      color: #1a202c;
      margin: 1.2rem 0 0.7rem 2.2rem;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid #e2e8f0;
      z-index: 2;
      position: relative;
    }
    .photos-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: center;
      width: 100%;
      padding: 1.2rem 24px 2rem 24px;
      box-sizing: border-box;
      background: #fff;
    }
    .photo-item {
      flex: 1 1 320px;
      max-width: 320px;
      min-width: 220px;
      height: 200px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      overflow: hidden;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 14px;
    }
    @media print {
      .photos-section, .photos-grid {
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        padding: 0;
        margin: 0;
      }
      .photo-item {
        box-shadow: none;
        border: 1px solid #e2e8f0;
      }
    }
  </style>
</head>
<body>
  <div class="photos-section">
    <div class="section-title">Photos avant travaux</div>
    <div class="photos-grid">
      {{#each images}}
        <div class="photo-item">
          <img src="{{url}}" alt="Photo avant travaux">
        </div>
      {{/each}}
    </div>
  </div>
</body>
</html>
