<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .property-page-1 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      background: var(--bg-gradient-primary);
      page-break-after: always;
      break-after: page;
      position: relative;
    }

    .property-page-1::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      z-index: 1;
    }

    .cover-photo-container {
      width: 100%;
      max-width: 900px;
      height: 50vh;
      margin-bottom: 2.5rem;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--color-border);
      position: relative;
      z-index: 2;
    }

    .cover-photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .description-content {
      width: 100%;
      max-width: 900px;
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--color-border);
      position: relative;
      z-index: 2;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 0.7rem;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid var(--color-border);
      flex-shrink: 0;
    }

    @media print {
      .property-page-1 {
        page-break-after: always !important;
        break-after: page !important;
        min-height: 100vh !important;
      }
    }
  </style>
</head>
<body>
  <!-- PAGE 1: Description du bien avec photo de couverture -->
  <div class="property-page-1">
    <h1 class="section-title" style="margin-top: 0; margin-bottom: 1.5rem;">Description du bien</h1>
    {{#if coverPhoto}}
    <div class="cover-photo-container">
      <img src="{{coverPhoto}}" alt="Photo de couverture" />
    </div>
    {{/if}}
    <div class="description-content">
      <div style="width:100%; margin-bottom:2rem;">
        <div style="font-size:var(--font-size-2xl); color:var(--color-primary); font-weight:700; margin-bottom:1rem; letter-spacing:-0.01em; line-height:1.3;">{{inputsGeneral.adresseBien}}</div>
        {{#if description}}
        <div style="margin-bottom:1.2rem;">
          <p style="font-size:var(--font-size-lg); color:var(--color-text-secondary); line-height:1.8; text-align:justify;">{{description}}</p>
        </div>
        {{/if}}
      </div>
    </div>
  </div>
</body>
</html>
