<div class="section-intro">
  <div class="section-intro-content">
    <h2>{{title}}</h2>
    <div class="section-description">
      {{{description}}}
      {{#if description_2}}
      <p>{{description_2}}</p>
      {{/if}}
    </div>
  </div>
  {{#if summary}}
    <div class="section-summary">
      <span>RÉSUMÉ</span>
      <div class="summary-content">{{{summary}}}</div>
    </div>
  {{/if}}
  {{#if footer_note}}
    <div class="section-footer-note">{{{footer_note}}}</div>
  {{/if}}
</div>
