<div class="toc-page">
  <div class="toc-header">
    <h1>Sommaire</h1>
    <div class="toc-divider"></div>
  </div>
  <div class="toc-content">
    <ul class="toc-list">
      {{#each sections}}
      <li class="toc-item">
        <span class="toc-number">{{add @index 1}}</span>
        <span class="toc-label">{{this.label}}</span>
        <span class="toc-dots"></span>
        <span class="toc-page-number">{{this.pageNumber}}</span>
      </li>
      {{/each}}
    </ul>
  </div>
</div>
