<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f7f6f2;padding:60px 40px 40px 40px;">
  <h1 style="font-size:2.6em;font-weight:700;margin-bottom:2.2em;color:#1a237e;letter-spacing:0.04em;text-shadow:0 2px 8px #1a237e11;">Sommaire</h1>
  <ul style="list-style:none;padding:0;margin:0 auto;max-width:420px;width:100%;">
    {{#each sections}}
      <li style="font-size:1.35em;color:#333;margin-bottom:1.1em;padding-left:0.5em;border-left:4px solid #bfa77a;background:#fffbe7;border-radius:4px;box-shadow:0 2px 8px rgba(191,167,122,0.07);">
        {{this.label}}
      </li>
    {{/each}}
  </ul>
</div>
<div style="page-break-after:always;"></div>
